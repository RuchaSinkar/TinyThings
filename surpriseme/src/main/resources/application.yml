spring:
  datasource:
    url: jdbc:h2:file:./data/tinythings
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: this-is-a-dev-only-secret-change-it-before-prod-min-32-bytes
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 2592000000

logging:
  level:
    org.springframework.security: DEBUG

groq:
  api-key: ${GROQ_API_KEY:}
  model: openai/gpt-oss-20b
